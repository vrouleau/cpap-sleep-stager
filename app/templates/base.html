<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sleep Stager{% endblock %}</title>
  <link rel="stylesheet" href="{{ static('app.css') }}">
  <link rel="icon" href="{{ static('favicon.svg') }}">
</head>
<body>
{% set active = active | default('') %}
<div class="shell">
  <nav class="side" aria-label="Main">
    <a href="/" class="brand"><span class="dot"></span>Sleep Stager</a>
    <ul>
      <li><a href="/" data-keep-range class="{{ 'on' if active == 'sleep' }}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sleep trends</a></li>
      <li><a href="/cpap" data-keep-range class="{{ 'on' if active == 'cpap' }}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>CPAP trends</a></li>
      <li><a href="/nights" data-keep-range class="{{ 'on' if active == 'nights' }}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Nights</a></li>
      <li><a href="/import" class="{{ 'on' if active == 'import' }}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>Data import</a></li>
    </ul>
    <p class="side-foot">Not a medical device. Staging from breathing, pulse and motion is an estimate.</p>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</div>
<script>
/* tabs keep the chosen trend range (it lives in the URL query) */
document.querySelectorAll('a[data-keep-range]').forEach(a => {
  const q = new URLSearchParams(location.search);
  if (q.has('range')) a.search = q.toString();
});
</script>
{% block scripts %}{% endblock %}
</body>
</html>
